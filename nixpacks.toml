# Railway's Nixpacks build auto-detects Node via package.json. It does not
# include Python by default, but pipeline/lib/analyze_drawings.py (the
# drawing-analysis worker step) shells out to python3 and needs it plus
# pymupdf + anthropic.
#
# IMPORTANT: declaring [phases.setup] here REPLACES Nixpacks' auto-detected
# setup phase rather than merging with it — an earlier version of this file
# only listed python311/pip and silently dropped Node, breaking `npm ci`
# with exit 127. nodejs_20 must be listed explicitly alongside Python.
[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]
