[build]
builder = "nixpacks"
buildCommand = "python3 -m ensurepip --upgrade && python3 -m pip install --break-system-packages -r requirements.txt && npm install --omit=dev && npm run build:worker"


[deploy]
startCommand = "node pipeline/worker.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
